name: Release

on:
  push:
    branches:
      - main
  # Recovery for a release that exists without its artifacts. release-please
  # can create the tag and the GitHub release and then fail on a later API
  # call (v1.0.0-alpha.21, 2026-09-15); its outputs are then unset, both jobs
  # below are skipped, and every later run sees the release as done. Run this
  # workflow by hand with that tag to build the binaries and publish the
  # templates the tag carries.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.0.0-alpha.21
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened or pushed with GITHUB_TOKEN holds its CI runs for manual
      # approval. Acting as the release App lets the release PR's CI start on
      # its own.
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    name: Build and publish release binaries
    needs: release-please
    # always(): on a manual run release-please is skipped, and a skipped need
    # would skip this job too.
    if: always() && (needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-templates:
    # The official template modules ship through the cli's own publish
    # pipeline (0011:D25): the freshly built opm runs every gate,
    # so a rotten template fails the release. The script filters to
    # unpublished versions caller-side (0011:D15) — a release with no template
    # version bumped publishes nothing and succeeds.
    name: Publish template modules
    needs: release-please
    if: always() && (needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'

      - name: Build opm
        run: go build -o bin/opm ./cmd/opm

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish unpublished templates
        run: .github/scripts/publish-templates.sh
        env:
          GHCR_AUTH: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}

name: Release

# release-please (as the opm-release-please App) creates the release tag and a
# draft GitHub Release. The official template modules are then gated and
# published, and only after that does goreleaser upload every asset into the
# draft and publish it last, so no release is published without its templates.
# Release tags are immutable: nothing here moves, deletes or re-creates a tag,
# and a published release is never changed.
#
# The release-please step uses the App token with no GITHUB_TOKEN fallback.
# Only the App may create a tag, and release-please swallows a refused tag
# creation (any 422), so another token would leave a draft with no tag.
#
# Recovery runbook:
#   - Draft with missing or partial assets: re-run the failed jobs, or run
#     this workflow by hand with the tag.
#   - Published release that is wrong or incomplete: cut the next patch;
#     never re-tag, never delete.
#   - Tag with no GitHub Release: re-run the release-please job of the run
#     that merged the release PR; a manual run cannot fix it.
#   - A second, empty draft for the same tag (a release-please re-run): the
#     owner removes it in the browser; the workflow never deletes a release.
#   - A draft whose tag does not exist (the goreleaser checkout fails on the
#     tag): release-please ran with a token that may not create tags. Restore
#     the App token, set the release PR back to autorelease: pending and
#     re-run the release-please job; the owner removes the tagless draft in
#     the browser.
#   - Template job failed: goreleaser refuses to build, so the release stays a
#     draft. A transient failure: re-run the failed jobs, or run this workflow
#     by hand with the tag. A gate failure: the tag never moves; bump the
#     template on main and cut the next patch; the owner removes the abandoned
#     draft in the browser.
#   - A brand-new template: after its first publish the owner makes its GHCR
#     package public in the browser. The gate lists versions anonymously, so
#     until then every release fails for that template.
#   - Published release with no docs bundle (publish-docs failed or did not
#     run): re-run the failed job, or dispatch docs.yml on main in release
#     mode with the tag (see docs.yml). Only a release whose tree has
#     hack/docskit-dump can have a bundle.
#   - Published release whose downstreams were not notified: if Notify
#     downstream failed, re-run the failed jobs; if it was skipped (a manual
#     run from a branch other than main published the draft), nothing re-sends
#     it and the downstream receivers' daily sweep picks the release up. The
#     job runs only after goreleaser published the release, never for a
#     published tag (goreleaser's draft check fails first), and does not wait
#     for publish-docs. CASCADE_NOTIFY=off stops the notify.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag, for example v1.0.0-beta.2. A draft is
          finished and published; a published release is refused (cut the
          next patch); a tag with no release is refused (re-run the
          release-please job of the run that merged the release PR).
        required: true
        type: string

# Every job grants exactly what it uses, so the repository's default token
# can be read-only.
permissions: {}

jobs:
  release-please:
    name: Release Please
    # The only job that reads RELEASE_APP_PRIVATE_KEY. The release Environment
    # deploys from main only; the ref check keeps the key off any other ref
    # even if a trigger is added later.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    # No GITHUB_TOKEN scope: the job acts only through the App token.
    permissions: {}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened or pushed with GITHUB_TOKEN holds its CI runs for manual
      # approval. Acting as the release App lets the release PR's CI start on
      # its own.
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    name: Build and publish release binaries
    # publish-templates runs first: a template failure keeps the release a
    # draft (the "Require the published templates" step below).
    needs: [release-please, publish-templates]
    # always(): on a manual run release-please is skipped, and a skipped need
    # would skip this job too.
    if: always() && (needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # One run per tag: two runs on one draft would delete each other's
    # uploads and the later one would create a second release for the tag.
    concurrency:
      group: goreleaser-${{ needs.release-please.outputs.tag_name || inputs.tag }}
      cancel-in-progress: false
    permissions:
      # The draft check needs write: GitHub hides draft releases from
      # read-only tokens, so with contents: read every draft reads as missing.
      contents: write
      # GoReleaser pushes the container image to GHCR.
      packages: write
    steps:
      - name: Check the release is still a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          rc=0
          out=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1) || rc=$?
          if [ "$rc" -eq 0 ]; then
            case "$out" in
              true)
                echo "release ${TAG} is a draft; building" ;;
              false)
                echo "::error::release ${TAG} is already published; its assets can no longer change and its tag never moves."
                echo "release ${TAG} is already published; its assets can no longer change and its tag never moves."
                echo "Cut the next patch release instead."
                exit 1 ;;
              *)
                echo "::error::unexpected draft state for ${TAG}: ${out}"
                exit 1 ;;
            esac
          else
            case "$out" in
              *"release not found"*)
                echo "::error::no GitHub Release exists for ${TAG}; re-run the release-please job of the run that merged the release PR."
                echo "no GitHub Release exists for ${TAG}; re-run the release-please job of the run that merged"
                echo "the release PR (the release PR is still labelled autorelease: pending)."
                exit 1 ;;
              *)
                echo "::error::gh release view ${TAG} failed (exit ${rc}): ${out}"
                exit 1 ;;
            esac
          fi

      # A step, not a job-level condition: a skipped goreleaser would lose the
      # draft check's refusal of a published release.
      - name: Require the published templates
        env:
          RESULT: ${{ needs.publish-templates.result }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::publish-templates did not succeed (${RESULT}); release ${TAG} stays a draft."
            echo "publish-templates did not succeed (${RESULT}); release ${TAG} stays a draft and no binary is built."
            echo "A transient failure: re-run the failed jobs. A gate failure: bump the template on main and cut the next patch."
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
          # No Actions cache in a publishing job: main's cache scope is
          # written by runs of other code (the cascade's compute and gates).
          cache: false

      # dockers_v2 builds the multi-arch image with buildx. The Dockerfile has
      # no RUN step (it only copies the cross-compiled binary), so no QEMU.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Exact pin: the draft match by name and the publish step are
          # version-specific; bump only with a sandbox or release run that
          # proves the new version.
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-templates:
    # The official template modules ship through the cli's own publish
    # pipeline (0011:D25): the freshly built opm runs every gate, `opm module
    # vet` and the tree-equals-zip check included, on every template before
    # it publishes any, so a rotten template fails the release. A template
    # whose tree differs from the artifact GHCR holds at its declared version,
    # or whose version is not the one `opm module init` resolves, fails here
    # before anything is pushed. The script publishes on the gate's verdict
    # (0011:D15): a release with no template version bumped publishes nothing
    # and succeeds. It runs first and goreleaser waits for it. It has no draft
    # check: it touches neither the tag nor the release, so a manual run can
    # restore the templates of a published release.
    name: Publish template modules
    needs: release-please
    if: always() && (needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
          # No Actions cache in a publishing job: main's cache scope is
          # written by runs of other code (the cascade's compute and gates).
          cache: false

      - name: Build opm
        run: go build -o bin/opm ./cmd/opm

      - name: Install cue (the version go.mod requires)
        run: go install "cuelang.org/go/cmd/cue@$(go list -m -f '{{.Version}}' cuelang.org/go)"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish unpublished templates
        run: .github/scripts/publish-templates.sh

  publish-docs:
    name: Publish the cli docs bundle
    # The docs bundle of this release (docs-kit.cue): the command reference,
    # the authored pages under docs/site/ and the library, core and
    # opm-operator versions this tree pins, which opmodel.dev follows to
    # their bundles (docs-kit C15, C16). goreleaser publishes the release
    # last, so the bundle follows a published release only: a release left a
    # draft has none until the manual run that finishes it.
    needs: [release-please, goreleaser]
    # always(): on a manual run release-please is skipped. publish.yml
    # refuses every ref but main (docs-kit C5), so a manual run from another
    # branch skips this job instead of failing it.
    if: always() && needs.goreleaser.result == 'success' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    # Pinned by docs-kit release tag, not a SHA: the signing certificate names
    # publish.yml at this ref, and the site trusts only docs-kit's v* tags
    # (docs-kit C5, C9). Moves with .opm-docs-version in one PR
    # (task docs:pins:check).
    uses: open-platform-model/docs-kit/.github/workflows/publish.yml@v0.4.0
    with:
      project: cli
      mode: release
      tag: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      # hack/docskit-dump runs with go run (docs-kit C14).
      setup-go: true

  # Caller-owned: it declares environment: cascade and passes
  # secrets.CASCADE_APP_PRIVATE_KEY to the SHA-pinned cascade-notify action
  # as its private-key input.
  notify-downstream:
    name: Notify downstream
    needs: [release-please, goreleaser]
    if: ${{ !cancelled() && needs.goreleaser.result == 'success' && github.ref == 'refs/heads/main' && vars.CASCADE_NOTIFY != 'off' }}
    runs-on: ubuntu-latest
    environment: cascade
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Notify downstream
        uses: open-platform-model/.github/.github/actions/cascade-notify@2376ffae4bfc665f327d51581350dea694c01504 # .github main
        with:
          tag: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          client-id: ${{ vars.CASCADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CASCADE_APP_PRIVATE_KEY }}

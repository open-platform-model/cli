name: Cascade Task

# The full scenario test of task deps:cascade (workspace RELEASING.md, "The
# cascade" and "Rollout and changes"; Phase 2 cascade contract §8). It reads
# GHCR, the Go proxy and GitHub releases, so it is not a required check: a
# registry blip must not block an unrelated PR. The offline scenarios run in
# pr.yml's required Lint job. Local: task -x deps:cascade:test.
on:
  pull_request:
    branches:
      - main
    paths:
      - '.tasks/cascade/**'
      - 'Taskfile.yml'
      - '.tasks/*.yaml'
      - '.github/workflows/cascade-task.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cascade-task:
    name: Cascade task (network)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The repo and the resolver are checked out side by side, so the resolver
      # never sits inside the tree test.sh copies into its sandboxes (contract
      # §3; v1.1 clarification C4). The resolver comes from this repo's pinned
      # .github commit, the one SHA every cascade reference here carries, so
      # CI tests the resolver the receiver runs; it moves only through a
      # ci(deps) pin PR (RELEASING.md, "Pinning the cascade code").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
      - name: Check out the shared cascade resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/.github
          ref: 6938f8e0247e019cb0c2db13fff5b7b558a6b67d # .github main
          path: org-github
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
          cache-dependency-path: repo/go.sum
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Run the cascade scenarios
        # test.sh runs every scenario against its stub; the title and body
        # scenario also runs against the real resolver (CASCADE_RESOLVER_REAL),
        # and test.sh fails at once if that path is not an executable file.
        working-directory: repo
        env:
          CASCADE_TEST_SET: all
          CASCADE_RESOLVER_REAL: ${{ github.workspace }}/org-github/.github/scripts/cascade/cascade-resolve.sh
        run: task -x deps:cascade:test

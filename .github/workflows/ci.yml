name: CI
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
      - name: Release-pin gate (G1)
        # Release PRs only: no local, unpublished or mismatched pin ships
        # (workspace RELEASING.md, section "Gates"). Local: task deps:release-check.
        if: startsWith(github.head_ref || github.ref_name, 'release-please--')
        run: .github/scripts/release-pin-check.sh
      - name: Verify the docs-kit pins agree
        # .opm-docs-version and every docs-kit publish.yml ref name the same
        # release (docs-kit C5, C12); offline. Local: task docs:pins:check.
        run: bash .tasks/opm-docs.sh pin-check
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3
          args: --timeout=5m
          # A run restored whole from the action's cache has reported
          # //nolint:staticcheck directives as unused (nolintlint) that a full
          # analysis of the same commit uses, so lint runs uncached.
          skip-cache: true

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Same seeding as pr.yml's unit job: the examples and e2e testdata pin
    # the tree's fixture version, which GHCR holds only after
    # publish-fixtures.yml runs, and that run races this one on a push to
    # main. Core and the catalogs still come from GHCR.
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      CUE_REGISTRY: 'testing.opmodel.dev=localhost:5000+insecure,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
      OPM_REGISTRY: 'testing.opmodel.dev=localhost:5000+insecure,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
      CUE_CACHE_DIR: ${{ github.workspace }}/.cue-cache
      OPM_BIN: ./bin/opm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
      - name: Build opm
        run: go build -o bin/opm ./cmd/opm
      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Seed the job-local registry from the tree
        run: hack/fixtures.sh seed
      - name: Run unit tests
        run: go test ./internal/... ./hack/...

  openspec:
    # Spec-only work lands as direct commits on main, which pr.yml never sees,
    # so this push workflow is the gate that keeps the main specs parseable.
    # Local equivalent: task openspec:check (task openspec:install once).
    name: OpenSpec Specs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
      - name: Install openspec
        run: npm install -g @fission-ai/openspec@1.12.0
      - name: Validate main specs and active changes
        run: task openspec:check

name: PR Checks
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR mapping: the default for every job. Anything these jobs resolve must
  # be published (public) on GHCR, the same arrangement as the library repo's
  # CI. testing.opmodel.dev carries this repo's fixture modules, published by
  # publish-fixtures.yml on merge; it is a GHCR-backed domain like any other.
  # The exception is the fixture coordinate a PR changes: the fixtures, unit
  # and E2E jobs (and the unit job in ci.yml) run a job-local registry,
  # seed it from the tree (hack/fixtures.sh seed) and override this mapping
  # so testing.opmodel.dev resolves from that seed while core and the
  # catalogs still come from GHCR.
  OPM_REGISTRY: 'testing.opmodel.dev=ghcr.io/open-platform-model,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
  CUE_REGISTRY: 'testing.opmodel.dev=ghcr.io/open-platform-model,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
      - name: Verify the cascade wiring
        run: task cascade:wiring:check
      - name: Cascade task (offline)
        # task deps:cascade's offline scenarios against the stub resolver; no
        # registry or proxy access. Lint is the cli's required check (workspace
        # RELEASING.md, "Rulesets on main"); the full set runs in
        # cascade-task.yml ("Rollout and changes"). Local: task -x deps:cascade:test.
        env:
          CASCADE_TEST_SET: offline
        run: task -x deps:cascade:test
      - name: Release-pin gate (G1)
        # Release PRs only: no local, unpublished or mismatched pin ships
        # (workspace RELEASING.md, section "Gates"). Local: task deps:release-check.
        if: startsWith(github.head_ref || github.ref_name, 'release-please--')
        run: .github/scripts/release-pin-check.sh
      - name: Verify the docs-kit pins agree
        # .opm-docs-version and every docs-kit publish.yml ref name the same
        # release (docs-kit C5, C12); offline. Local: task docs:pins:check.
        run: bash .tasks/opm-docs.sh pin-check
      - name: Docs bundles for moved pins
        # A warning, never a failure: when the PR moves library or the
        # embedded operator, every docs bundle the tree pins should be
        # published before the next release PR, whose G1 fails without it.
        # It runs here, with this job's read-only token, and not in the
        # cascade task, so the cascade's compute never runs a newly pinned
        # library's code. Local: .github/scripts/docs-pins-check.sh --warn
        # --moved-from origin/main.
        if: github.event_name == 'pull_request'
        timeout-minutes: 10
        continue-on-error: true # a timeout stays a warning too
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>&1; then
            echo "::warning title=Docs bundle::docs bundles not checked: cannot fetch the base commit $BASE_SHA"
            exit 0
          fi
          .github/scripts/docs-pins-check.sh --warn --moved-from "$BASE_SHA"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3
          args: --timeout=5m
          # A run restored whole from the action's cache has reported
          # //nolint:staticcheck directives as unused (nolintlint) that a full
          # analysis of the same commit uses, so lint runs uncached.
          skip-cache: true

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Fixtures from a job-local registry seeded from the tree, as in the
    # fixtures and E2E jobs: the examples and e2e testdata pin the tree's
    # fixture version, which GHCR holds only after publish-fixtures.yml runs
    # on merge. Core and the catalogs still come from GHCR.
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      CUE_REGISTRY: 'testing.opmodel.dev=localhost:5000+insecure,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
      OPM_REGISTRY: 'testing.opmodel.dev=localhost:5000+insecure,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
      CUE_CACHE_DIR: ${{ github.workspace }}/.cue-cache
      OPM_BIN: ./bin/opm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
      - name: Build opm
        run: go build -o bin/opm ./cmd/opm
      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Seed the job-local registry from the tree
        run: hack/fixtures.sh seed
      - name: Run unit tests
        run: go test ./internal/... ./hack/...

  openspec:
    # The main specs are the CLI's behavioral record. A spec the validator no
    # longer parses (missing Purpose, delta headers in a main spec, a
    # requirement without a scenario) fails the PR like a lint error would.
    # Local equivalent: task openspec:check (task openspec:install once).
    name: OpenSpec Specs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
      - name: Install openspec
        run: npm install -g @fission-ai/openspec@1.12.0
      - name: Validate main specs and active changes
        run: task openspec:check

  template-gates:
    # Every gate runs over every template tree on each PR (dry-run, no push):
    # the same script the release publishes through, so a template that would
    # fail the release fails the PR first. The gates include `opm module vet`,
    # which renders each template's debugValues, and a check that the tree
    # equals its module zip, so what vet read is what publishes. A template
    # whose tree differs from the artifact GHCR holds at its declared version,
    # or whose version is not the one `opm module init` resolves (the highest
    # published stable version, or an unpublished one above it), fails; the
    # release job runs the same gates on every template before any publish.
    name: Template Publish Gates (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
      - name: Build opm
        run: go build -o bin/opm ./cmd/opm
      - name: Install cue (the version go.mod requires)
        run: go install "cuelang.org/go/cmd/cue@$(go list -m -f '{{.Version}}' cuelang.org/go)"
      - name: Dry-run the template publish gates
        run: .github/scripts/publish-templates.sh --dry-run

  fixtures:
    # The repo's published test fixtures (tests/fixtures/modules/*), the same
    # flow opm-operator runs (hack/fixtures.sh is an identical copy in both):
    #   check  every publish gate, dry-run against GHCR, plus changed-implies-
    #          bumped: a fixture edited in this PR must carry a version GHCR
    #          does not hold yet, because published versions are immutable.
    #   seed   publish the tree's fixtures into a job-local registry.
    #   consumers  each consumer pins exactly what CUE resolves for its fixtures.
    # Then the registry-backed render-parity program runs against that seed
    # (tree load == registry acquisition at the fixture's declared version),
    # with core and the catalogs still from GHCR. The unit and E2E jobs seed
    # their own job-local registry the same way. publish-fixtures.yml
    # publishes the same coordinate to GHCR on merge.
    name: Fixtures (gates, seed, render parity)
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      MIXED_CUE_REGISTRY: 'testing.opmodel.dev=localhost:5000+insecure,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
      # A fresh module cache: a warm one would serve the fixture without
      # touching the seeded registry and hide a bad mapping.
      CUE_CACHE_DIR: ${{ github.workspace }}/.cue-cache
      OPM_BIN: ./bin/opm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `hack/fixtures.sh check` diffs each fixture against the base branch.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
      - name: Build opm
        run: go build -o bin/opm ./cmd/opm
      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Fixture publish gates (changed implies bumped)
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: hack/fixtures.sh check
      - name: Seed the job-local registry from the tree
        env:
          CUE_REGISTRY: ${{ env.MIXED_CUE_REGISTRY }}
          OPM_REGISTRY: ${{ env.MIXED_CUE_REGISTRY }}
        run: hack/fixtures.sh seed
      - name: Fixture consumers follow their fixtures
        env:
          CUE_REGISTRY: ${{ env.MIXED_CUE_REGISTRY }}
          OPM_REGISTRY: ${{ env.MIXED_CUE_REGISTRY }}
        run: hack/fixtures.sh consumers examples tests/e2e/testdata/operator-owned
      - name: Render parity (tree vs seeded registry)
        env:
          CUE_REGISTRY: ${{ env.MIXED_CUE_REGISTRY }}
          OPM_REGISTRY: ${{ env.MIXED_CUE_REGISTRY }}
          OPM_ITEST_RENDER_PARITY: '1'
        run: go run tests/integration/render-parity/main.go

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
      - name: Install kind
        run: |
          KIND_VERSION="v0.31.0"
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa  ./kind" | sha256sum -c -
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Create kind cluster
        run: kind create cluster --name opm-dev --config hack/kind-config.yaml --image kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48
      - name: Install ModuleInstance CRDs
        # The CLI records inventory in the ModuleInstance CR, so the CRD is a
        # hard prerequisite for every apply-path integration program.
        run: go run ./cmd/opm operator install --crds-only --context kind-opm-dev
      - name: Run integration scripts
        run: |
          go run tests/integration/deploy/main.go
          go run tests/integration/inventory-apply/main.go
          go run tests/integration/inventory-ops/main.go
          go run tests/integration/inst-list/main.go
          go run tests/integration/migration/main.go
          go run tests/integration/gates/main.go
      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name opm-dev || true

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Fixtures from a job-local registry seeded from the tree, as in the
    # fixtures job: the published-fixture tests and the examples resolve the
    # tree's fixture version, which GHCR holds only after
    # publish-fixtures.yml runs on merge. Core and the catalogs still come
    # from GHCR.
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      CUE_REGISTRY: 'testing.opmodel.dev=localhost:5000+insecure,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
      OPM_REGISTRY: 'testing.opmodel.dev=localhost:5000+insecure,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
      CUE_CACHE_DIR: ${{ github.workspace }}/.cue-cache
      OPM_BIN: ./bin/opm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
      - name: Build opm
        run: go build -o bin/opm ./cmd/opm
      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Seed the job-local registry from the tree
        run: hack/fixtures.sh seed
      # -timeout matches task test:e2e; see that task's summary for why the
      # 10-minute default truncates a destructive test's cleanup.
      - name: Run E2E tests
        run: go test ./tests/e2e/... -v -timeout 25m

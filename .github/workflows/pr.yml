name: PR Checks
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR mapping: no registry service runs in CI, so anything the tests
  # genuinely resolve must be published (public) on GHCR — same arrangement as
  # the library repo's CI. testing.opmodel.dev carries this repo's fixture
  # modules, published by publish-fixtures.yml; it is a GHCR-backed domain like
  # any other, not a local-registry alias.
  OPM_REGISTRY: 'testing.opmodel.dev=ghcr.io/open-platform-model,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
  CUE_REGISTRY: 'testing.opmodel.dev=ghcr.io/open-platform-model,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3
          args: --timeout=5m

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
      - name: Run unit tests
        run: go test ./internal/...

  template-gates:
    # The publish gates run over every template tree on each PR (dry-run, no
    # push) — the same script the release publishes through, so a template
    # that would fail the release fails the PR first.
    name: Template Publish Gates (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
      - name: Build opm
        run: go build -o bin/opm ./cmd/opm
      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Dry-run the template publish gates
        run: .github/scripts/publish-templates.sh --dry-run

  fixture-gates:
    # The same gates over the fixture trees, dry-run. A fixture that would fail
    # publish-fixtures.yml fails the PR first, rather than after merge when the
    # publish workflow is the only thing that would have caught it.
    name: Fixture Publish Gates (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
      - name: Build opm
        run: go build -o bin/opm ./cmd/opm
      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Dry-run the fixture publish gates
        run: .github/scripts/publish-fixtures.sh --dry-run

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
      - name: Install kind
        run: |
          KIND_VERSION="v0.31.0"
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa  ./kind" | sha256sum -c -
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Create kind cluster
        run: kind create cluster --name opm-dev --config hack/kind-config.yaml --image kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48
      - name: Install ModuleInstance CRDs
        # The CLI records inventory in the ModuleInstance CR, so the CRD is a
        # hard prerequisite for every apply-path integration program.
        run: go run ./cmd/opm operator install --crds-only --context kind-opm-dev
      - name: Run integration scripts
        run: |
          go run tests/integration/deploy/main.go
          go run tests/integration/inventory-apply/main.go
          go run tests/integration/inventory-ops/main.go
          go run tests/integration/inst-list/main.go
          go run tests/integration/migration/main.go
          go run tests/integration/gates/main.go
      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name opm-dev || true

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
      - name: Run E2E tests
        run: go test ./tests/e2e/... -v

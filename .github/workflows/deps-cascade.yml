name: Deps cascade

# The release-cascade receiver (workspace RELEASING.md, "The receiver").
# An upstream release (library, opm-operator or catalog_opm) dispatches
# upstream-released here; the daily sweep and a manual run cover a dispatch
# that never arrived. The shared workflow in open-platform-model/.github at
# main does the work: it runs this repo's task -x deps:cascade, posts the
# release-PR gates, and publishes the rolling deps/cascade pull request.
#
# The receiver fails closed: every run is a dry run (compute and summarize,
# push nothing) unless the repository variable CASCADE_DRY_RUN is exactly
# false, and a manual run with dry_run set is a dry run either way. A run
# from any ref but main is always a dry run. No secret is passed: the
# shared workflow mints the App token in the main-only cascade Environment.

on:
  repository_dispatch:
    types: [upstream-released]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute and show the diff in the job summary; push nothing
        type: boolean
        default: false
      gates_only:
        description: Evaluate and post the release-PR gates only (sent by Cascade gates)
        type: boolean
        default: false

permissions: {}

# Real runs on main share deps-cascade: one active, one pending, none
# cancelled mid-run. Gates-only runs and branch runs get their own groups,
# so they never replace a pending real run (RELEASING.md, "Concurrency").
concurrency:
  group: ${{ github.ref != 'refs/heads/main' && format('deps-cascade-{0}', github.ref) || (inputs.gates_only && 'deps-cascade-gates' || 'deps-cascade') }}
  cancel-in-progress: false

jobs:
  cascade:
    name: Deps cascade
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: open-platform-model/.github/.github/workflows/cascade-receive.yml@main
    with:
      dry-run: ${{ inputs.dry_run == true || vars.CASCADE_DRY_RUN != 'false' }}
      gates-only: ${{ inputs.gates_only == true }}
      g2-mode: ${{ vars.CASCADE_G2_MODE || 'warn' }}
      g3-mode: ${{ vars.CASCADE_G3_MODE || 'warn' }}
      # The cascade task builds opm and runs go get, go mod tidy and
      # go run ./hack/docskit-dump.
      setup-go: true
      # .github/labels.yml owns this repo's labels, so the receiver only
      # checks that the cascade labels exist and never creates one.
      labels-managed: true

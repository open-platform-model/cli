name: Publish Fixtures

# The repo's own test-fixture modules live on the testing domain
# (testing.opmodel.dev/modules/cli/*) and are published to GHCR, so consumers —
# examples, e2e testdata, the kind dev cluster, a fresh clone — resolve them
# from a public registry with no local registry involved. CI is the one
# exception: the fixtures, unit and E2E jobs in pr.yml and the unit job in
# ci.yml each seed a job-local registry from the tree (hack/fixtures.sh seed)
# and resolve testing.opmodel.dev from it, so a fixture bump and its consumers
# land in one PR and a push to main never races this workflow; this workflow
# publishes the same coordinate to GHCR on merge.
#
# Independent of the cli's release train: a fixture is not release-please
# managed, and a fixture bump should reach the registry without waiting for a
# release. An already-published version is treated as success, so pushing an
# unrelated change under tests/fixtures/modules/ publishes nothing.
#
# workflow_dispatch is the repair path: re-publish without waiting for a
# merge. It runs from main only.
on:
  push:
    branches:
      - main
    paths:
      - 'tests/fixtures/modules/**'
      - 'hack/fixtures.sh'
      - '.github/workflows/publish-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish fixture modules
    # Forks have no access to GITHUB_TOKEN with packages:write — skip cleanly.
    # Main only: a dispatch from another ref would publish that ref's fixtures
    # and scripts with packages: write.
    if: github.event.repository.fork == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          # No Actions cache in a publishing job: main's cache scope is
          # written by runs of other code (the cascade's compute and gates).
          cache: false

      - name: Build opm
        run: go build -o bin/opm ./cmd/opm

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish unpublished fixtures
        env:
          OPM_BIN: ./bin/opm
        run: hack/fixtures.sh publish

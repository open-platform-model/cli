name: Cite lint
# The comment rule: an enhancement id only beside a reason in words, never a
# decision number, never a lone id. The tool and its pin live in .github's
# cite-lint.yml (its enh-ref default); the pin of this call is the same .github
# SHA as every cascade reference (.tasks/cascade/wiring-check.yaml declares
# this file as kind cite-lint). Local: task cite-lint, which runs the tool at
# that default commit and holds the same exclude list as the call below: change
# one, change the other.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

jobs:
  cite-lint:
    name: Cite lint
    permissions:
      contents: read
    uses: open-platform-model/.github/.github/workflows/cite-lint.yml@3dcc82b2f30328cc01bbc478f825842de3fd207f # .github main
    with:
      paths: .
      exclude: |
        tests/fixtures/

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A new action release waits a week before Dependabot proposes it, so a
    # compromised release is more likely caught upstream first.
    cooldown:
      default-days: 7
    # docs-kit's publish.yml is pinned by release tag, not SHA, and moves
    # with .opm-docs-version in one PR (docs-kit C5, C12; task
    # docs:pins:check), so Dependabot never bumps it alone.
    ignore:
      - dependency-name: "open-platform-model/docs-kit*"
      # The cascade workflows, actions and resolver move together, one .github SHA per repo,
      # only through a ci(deps) pin PR (Phase 3 wiring contract 2.4; .github README
      # "Pinning and bumps"); a Dependabot bump would move one reference alone.
      - dependency-name: "open-platform-model/.github*"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # OPM modules (library) move through the release cascade or by hand as
    # fix(deps), never through Dependabot (workspace RELEASING.md, section
    # "The cascade").
    ignore:
      - dependency-name: "github.com/open-platform-model/*"
      # CUE moves only through a library release, whose own pull request runs
      # the CUE check; it reaches the cli through the cascade's library bump,
      # whose go get raises cuelang.org/go by minimal version selection
      # (library ADR-013, decision j4; workspace RELEASING.md, section
      # "Pin classes").
      # cuelabs.dev/go/oci/ociregistry is the CUE team's OCI module; the
      # library's go.mod sets its version (cuelang.org/go sets only a floor),
      # so it reaches the cli through the library bump and moves with library
      # releases.
      - dependency-name: "cuelang.org/go"
      - dependency-name: "cuelabs.dev/go/oci/ociregistry"
    commit-message:
      # pr-title.yml does not accept "deps" as a type, so third-party Go bumps
      # land as "build(deps)", a hidden type that cuts no release.
      prefix: "build"
      include: "scope"

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # OPM modules (library) move through the release cascade or by hand as
    # fix(deps), never through Dependabot (workspace RELEASING.md, section
    # "The cascade").
    ignore:
      - dependency-name: "github.com/open-platform-model/*"
    commit-message:
      # pr-title.yml does not accept "deps" as a type, so third-party Go bumps
      # land as "build(deps)", a hidden type that cuts no release.
      prefix: "build"
      include: "scope"

schema: spec-driven

context: |
  # OPM CLI Development Constitution
  
  ## Core Principles (CLI Application)
  
  ### I. Type Safety First
  All CLI configuration MUST be validated at load time. Invalid flags, config files,
  or module inputs MUST be rejected before any operation begins—never during execution.
  - Use CUE for config validation (~/.opm/config.cue)
  - Use Go's strong typing; avoid interface{} where possible
  - Validate early: flags → config → module → execute
  Rationale: Users should know immediately if their input is invalid.
  
  ### II. Separation of Concerns
  The CLI MUST maintain clear boundaries between:
  - Commands (cmd/): User interaction, flag parsing, output formatting
  - Business logic (internal/): CUE operations, K8s interactions, rendering
  - Shared utilities (pkg/): Reusable, stateless helpers
  Each package has a single responsibility. Commands orchestrate; they don't implement.
  Rationale: Prevents spaghetti code and makes testing easier.
  
  ### III. Composability
  Commands and packages MUST compose without tight coupling:
  - Commands call business logic via interfaces
  - Business logic packages don't import command packages
  - Output formatting is separate from data generation
  Rationale: Enables reuse and makes the codebase easier to extend.
  
  ### IV. Declarative Intent
  CLI output MUST express WHAT was done, not HOW:
  - Success: "Module validated" not "Ran cue vet, parsed AST, checked schema..."
  - Errors: State what's wrong and how to fix it, not internal stack traces
  - Verbose mode (-v) can show the HOW for debugging
  Rationale: Users care about outcomes, not implementation details.
  
  ### V. Portability by Design
  The CLI MUST work across platforms without modification:
  - No hardcoded paths (use os.UserHomeDir, filepath.Join)
  - No shell-specific behavior in commands
  - Test on Linux, macOS, Windows
  Rationale: Users shouldn't need to modify behavior per platform.
  
  ### VI. Semantic Versioning
  CLI releases MUST follow SemVer 2.0.0:
  - MAJOR: Breaking flag changes, removed commands
  - MINOR: New commands, new flags with defaults
  - PATCH: Bug fixes, performance improvements
  All commits MUST follow Conventional Commits: type(scope): description
  Rationale: Enables predictable upgrades and changelog automation.
  
  ### VII. Simplicity & YAGNI
  Start simple. New flags, commands, or packages MUST be justified:
  - Prefer fewer flags with smart defaults over many options
  - Prefer explicit configuration over magic inference
  - If a feature isn't requested, don't build it
  Rationale: Every flag is a maintenance burden and UX complexity.

  ### VIII. Mergeable Sections (Iterative & Incremental Delivery)
  A change is delivered as the sections of its `tasks.md` (`## N. Title` headings with `N.M`
  checkboxes). Two invariants hold at every section boundary; they replace any size limit on
  the change itself.
  - **Every merge leaves `main` releasable.** A section MUST end green under the validation
    gates and MUST close with a commit task naming the Conventional Commit it lands as
    (§ Commit Standards below). Nothing that would break `main` is carried across a section boundary.
  - **Work survives a session boundary.** The commit task is the pause point: a session that
    stops there leaves checked boxes and a clean tree, and the next session resumes by running
    apply again.
  - One PR per change, one commit per section, is the default. Section 1 is a spike whenever
    design.md carries an unverified assumption.
  - **WARNING & BLOCK**: when a request cannot be cut into sections that each satisfy both
    invariants, or needs more than about five, the Agent MUST warn, block, and propose a split
    into sequential changes (Execution Gate).

  ## Execution Gate (Agent Directive)
  Before beginning ANY implementation, the Agent MUST evaluate the request against the
  "Mergeable Sections" principle. Block only when the request cannot be cut into sections that
  each end green and leave `main` releasable, or when it needs more than about five such
  sections. In that case the Agent MUST reply with:
  "🛑 **Scope Warning**: This request does not cut into a handful of mergeable sections. I
  suggest we split it into the following changes: [list 2-3 changes, each a few sections that
  leave main releasable]. Should we start with the first?"

  ## Technology Standards
  
  Can be found in [AGENTS.md](../AGENTS.md)
  
  ## Code Style
  
  ### Go Patterns
  - Accept interfaces, return structs
  - Context propagation for all async operations
  - Wrap errors with context: fmt.Errorf("loading module: %w", err)
  - Commands use RunE for error handling
  - Table-driven tests with testify assertions
  
  ### Import Order
  1. Standard library
  2. External packages
  3. Internal packages
  
  ## Validation Gates (before merge)
  1. task fmt — All Go files formatted
  2. task lint — golangci-lint passes
  3. task test — All tests pass
  
  ## Commit Standards
  - Format: type(scope): description
  - Types: feat, fix, refactor, docs, test, chore
  - Scope: cmd, cue, kubernetes, output, config, etc.
  - Keep descriptions concise
  - Commits may end with the plain `Co-Authored-By: Claude <noreply@anthropic.com>` trailer (optional); never a session ID/URL or generated-with footer

rules:
  proposal:
    - "Focus: WHY we're doing this, WHAT's in/out of scope"
    - "Updates when: Scope changes, intent clarifies, approach fundamentally shifts"
    - Identify affected command(s) and package(s)
    - State whether this is MAJOR/MINOR/PATCH per SemVer
    - Scope MUST cut into at most about five tasks.md sections, each ending green and leaving
      `main` releasable on its own (Principle VIII).
    - "Delivery mode: one PR per change is the default and needs no statement. When a downstream
      consumer must pick up a published pin mid-change, add exactly one line to the proposal,
      `Delivery: one PR per section (<consumer> needs <pin> after section <N>)`, and the change
      ships section by section. In that mode the change stays active on main between PRs, and
      spec sync and enhancement delivery logging wait for archive after the last PR."
    - Complexity additions MUST include justification (Principle VII)
    - New flags MUST have sensible defaults
    - "If this change implements decisions from an enhancement in the sibling enhancements/ repo, create enhancement.yaml in this change directory declaring it (implements: [{enhancement: \"NNNN\", decisions: [D1, ...], resolves: []}]). Write it at creation time, while the enhancement is in context; it is what makes archive-time delivery logging mechanical."
  
  design:
    - "Focus: HOW we'll implement it technically"
    - "Updates when: Implementation reveals better approach, constraints change"
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY) to indicate requirement strength
    - MUST include "Research & Decisions" section when exploration was done
    - Document what was explored, alternatives considered, and rationale
    - |
      Format:
      ## Research & Decisions

      ### [Topic]
      **Context**: [Why this decision was needed]
      **Explored**: [What was investigated - link to exploration notes]
      **Options considered**:
      1. [Option A] - [pros/cons]
      2. [Option B] - [pros/cons]
      **Decision**: [Chosen option]
      **Rationale**: [Why this option was selected]
    - Include Go pseudo-code or function signatures
    - Reference upstream patterns (Timoni, kubectl) when applicable
    - Data flow diagrams for pipeline commands (build, apply, etc.)
    - "Error handling: what errors can occur and how they're surfaced"
    - 'Define command syntax: "opm <group> <command> [args] [flags]"' 
    - Document all flags with types, defaults, and descriptions
    - Specify exit codes (0=success, 1=usage error, 2=execution error)
    - Specify error messages and suggested fixes
    - Include example output for success and error cases
  
  specs:
    - "Focus: WHAT behavior is changing (not HOW it's implemented)"
    - "Updates when: New or changed requirements emerge"
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Describe observable behavior and user-facing outcomes
    - Use ADDED/MODIFIED/REMOVED sections to show deltas from current behavior
    - Include scenarios that demonstrate requirements
  
  tasks:
    - "Focus: STEPS to take for implementation"
    - "Updates when: Tasks complete, new tasks discovered, blockers identified"
    - "CRITICAL: Every `## N.` section MUST end green under the validation gates and MUST close
      with a commit task: an ordinary `- [ ] N.M` checkbox whose text names the Conventional
      Commit to make, e.g. `- [ ] 1.4 task lint and task test green, then commit feat(config): add the skewPolicy key`
      (types and scopes per § Commit Standards). The commit task is the pause point; nothing uncommitted is carried across
      a section boundary."
    - "CRITICAL: Cut the change into at most about five sections, each a coherent unit that
      leaves main releasable by itself. If it needs more, or a section cannot end green on its
      own, split into a new OpenSpec change. Section 1 is a spike whenever design.md carries an
      unverified assumption; its commit task lands what the spike produced (a test, a fixture,
      or the finding written into design.md)."
    - Each task should be independently testable
    - Group implementation tasks by package
    - Include the validation gates (`task lint`, `task test`) in every section's commit task, not as a
      trailing section; cross-cutting checks (integration tests, consumer builds) go into the last real section before
      its commit.
    - Include integration test tasks where K8s interaction is involved
    - "The section-closing commit is the ONLY delivery operation allowed in tasks.md: no pushing,
      branching, opening or merging PRs, tagging, cutting releases, and no commit-message or
      PR-body hygiene checks. Everything past the commit happens under the repo's normal git
      workflow (one PR per change by default; one PR per section only when the proposal says
      so). Sole exception: a change whose stated deliverable is itself a release or publishing
      operation; there those steps ARE the implementation."

# Operation hooks: served to the agent by `openspec instructions apply|archive --change <name>
# --json` as operationGuidance.
operations:
  apply:
    guidance:
      - "Work section by section: every `## N.` block of tasks.md ends with a commit task. Before
        checking that box, run the section's gates (`task lint`, `task test`) on the whole tree and make
        exactly the named Conventional Commit (types and scopes per § Commit Standards; optional plain Co-Authored-By: Claude
        <noreply@anthropic.com> trailer only, never a session link, never a bare @name, and
        no body line starting with word( because the squash body reaches release-please). Do not start the next section with uncommitted work in the tree."
      - "The commit task is the only delivery operation apply performs: no push, no branch
        creation, no PR, no tag, no release. Commit on the working branch the run started on,
        never on main."
      - "Pausing: when the user asks to pause, or a blocker appears, finish the current section's
        commit task first if its gates are green; otherwise report exactly which boxes are
        checked and what is uncommitted in the tree. A new session resumes by running apply
        again: the checked boxes plus a clean tree are the resume state."
      - "Delivery mode: unless proposal.md carries `Delivery: one PR per section`, all section
        commits ship in one PR after the last section and the PR title carries the change's
        release class. In per-section mode each section commit is the PR title and therefore a
        release trigger; the change stays active on main between PRs, and spec sync and enhancement
        delivery logging wait for archive after the last PR."
  archive:
    guidance:
      - "If this change directory contains enhancement.yaml, finish the archive by logging the landing: from the workspace root run `task enhancements:delivery:log FROM=<archived-change-path> SUMMARY=\"<one line: what landed>\"`. It appends a CUE-validated entry to each declared enhancement's delivery.yaml; confirm it printed 'logged' for every declared enhancement."

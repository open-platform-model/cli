# Cluster Platform singleton for the local kind dev cluster.
# Applied by: task cluster:operator
#
# The subscription pin here MIRRORS internal/config/templates.go's
# DefaultPlatformTemplate (and hack/platform.cue) on purpose. Handoff renders
# against the cluster Platform (0006 D11) and so does apply (D21), while the
# operator materializes this same document — if the pin drifted from the CLI's
# local default, the two actors could resolve different catalog builds and the
# D7.4 digest gate would compare renders that were never meant to match.
apiVersion: opmodel.dev/v1alpha1
kind: Platform
metadata:
  # Platform is a cluster singleton; the operator ignores any other name
  # (platform_controller.go: platformSingletonName = "cluster").
  name: cluster
spec:
  type: kubernetes
  registry:
    # Scalar subscription (0010): exactly one published catalog build per
    # entry, named by bare SemVer under the major-suffixed module path.
    opmodel.dev/catalogs/opm@v2:
      version: "2.0.0-alpha.5"
    opmodel.dev/catalogs/k8s@v1:
      version: "1.0.0-alpha.1"

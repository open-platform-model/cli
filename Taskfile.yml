version: "3"

# Silent by default - set TASK_VERBOSE=1 or use --verbose to show commands
silent: true

vars:
  BINARY_NAME: opm
  BUILD_DIR: bin
  CLUSTER_NAME: opm-dev
  K8S_NODE_IMAGE: "kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
  REGISTRY_CONTAINER: '{{.REGISTRY_CONTAINER | default "opm-registry"}}'
  # Canonical mapping (Registry Policy, root AGENTS.md): both opmodel.dev/* and
  # testing.opmodel.dev/* read from GHCR. The testing domain carries this repo's
  # fixture modules, published by .github/workflows/publish-fixtures.yml — it is
  # a GHCR-backed domain, not a local-registry alias. An exported OPM_REGISTRY
  # wins.
  OPM_REGISTRY:
    sh: echo "${OPM_REGISTRY:-testing.opmodel.dev=ghcr.io/open-platform-model,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works}"
  # Opt-in override for the kind dev cluster, EMPTY by default. Nothing the kind
  # flow resolves is local-only any more, so the operator's own built-in default
  # (which routes both domains to GHCR) is correct out of the box and
  # cluster:operator needs no local registry at all.
  #
  # Set this only to iterate on a module you have published locally, e.g.
  #
  #   task cluster:operator \
  #     KIND_CUE_REGISTRY='testing.opmodel.dev=opm-registry:5000+insecure,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
  #
  # Use the IN-CLUSTER spelling: the host reaches the registry on localhost:5000
  # (published port), but a pod reaches the same container by its name on kind's
  # docker network. Same blobs, two addresses — module identity is stable across
  # both, only the host part differs.
  KIND_CUE_REGISTRY: '{{.KIND_CUE_REGISTRY | default ""}}'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "v0.0.0-dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_DATE:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
  LDFLAGS: >-
    -X github.com/open-platform-model/cli/internal/version.Version={{.VERSION}}
    -X github.com/open-platform-model/cli/internal/version.GitCommit={{.COMMIT}}
    -X github.com/open-platform-model/cli/internal/version.BuildDate={{.BUILD_DATE}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  ## Build tasks
  build:
    desc: Build the CLI binary
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}} ./cmd/opm
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BUILD_DIR}}/{{.BINARY_NAME}}"

  build:all:
    desc: Build for all platforms
    cmds:
      - GOOS=linux GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}}-linux-amd64 ./cmd/opm
      - GOOS=linux GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}}-linux-arm64 ./cmd/opm
      - GOOS=darwin GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}}-darwin-amd64 ./cmd/opm
      - GOOS=darwin GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}}-darwin-arm64 ./cmd/opm
      - GOOS=windows GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}}-windows-amd64.exe ./cmd/opm

  #########################
  ## Testing tasks
  #########################
  test:
    desc: Run all tests
    cmds:
      - task: test:unit
      - task: test:integration
      - task: test:e2e

  test:unit:
    desc: Run unit tests only
    cmds:
      - go test ./internal/...
      - go test ./pkg/...
      - go test ./hack/...

  test:integration:
    desc: Run integration tests (requires cluster)
    summary: |
      Run integration tests against a live Kubernetes cluster.

      A running cluster is required. To create one:
        task cluster:create

      To check if a cluster is running:
        task cluster:status
    preconditions:
      - sh: kubectl cluster-info --context kind-opm-dev &>/dev/null
        msg: "Cluster 'kind-opm-dev' is not running. Run: task cluster:create"
    env:
      OPM_REGISTRY: "{{.OPM_REGISTRY}}"
    cmds:
      - go run tests/integration/deploy/main.go
      - go run tests/integration/apply-staging/main.go
      - go run tests/integration/inventory-apply/main.go
      - go run tests/integration/inventory-ops/main.go
      - go run tests/integration/inst-list/main.go
      - go run tests/integration/inst-tree/main.go
      - go run tests/integration/module-apply/main.go
      - go run tests/integration/gates/main.go
      - go run tests/integration/ssa-ownership/main.go
      - go run tests/integration/platform-build/main.go
      - go run tests/integration/render-parity/main.go
      - go run tests/integration/skip-unprovided/main.go

  test:e2e:
    desc: Run end-to-end tests
    summary: |
      The explicit -timeout is load-bearing, not padding. Go's default is 10
      minutes, and against a cluster whose operator cannot reconcile, the two
      operator-owned tests alone burn ~9.5 minutes waiting out their 3m
      deadlines (cli issue 214). The suite then times out inside
      TestE2E_Operator_InstallUninstallLifecycle, which is destructive by
      design and rebuilds the dev operator in a t.Cleanup — a timeout kills the
      process before that cleanup runs, so the cluster is left without an
      operator and the NEXT run fails for a reason that has nothing to do with
      it. Give the suite room to reach its own cleanups.
    cmds:
      - go test ./tests/e2e/... -v -timeout 25m

  test:fixtures:
    desc: 'What PR CI runs over tests/fixtures/modules: publish gates + changed-implies-bumped (hack/fixtures.sh check), seed the local registry from the tree (task registry:start at the workspace root), check that the consumers pin what CUE resolves for their fixtures (hack/fixtures.sh consumers), then render parity against it. Fixtures from localhost:5000, core and catalogs from GHCR.'
    vars:
      MIXED_CUE_REGISTRY: '{{.MIXED_CUE_REGISTRY | default "testing.opmodel.dev=localhost:5000+insecure,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works"}}'
    env:
      OPM_BIN: ./bin/opm
    cmds:
      - go build -o bin/opm ./cmd/opm
      - hack/fixtures.sh check
      - CUE_REGISTRY='{{.MIXED_CUE_REGISTRY}}' hack/fixtures.sh seed
      - CUE_REGISTRY='{{.MIXED_CUE_REGISTRY}}' hack/fixtures.sh consumers examples tests/e2e/testdata/operator-owned
      - CUE_REGISTRY='{{.MIXED_CUE_REGISTRY}}' OPM_REGISTRY='{{.MIXED_CUE_REGISTRY}}' OPM_ITEST_RENDER_PARITY=1 go run tests/integration/render-parity/main.go

  test:verbose:
    desc: Run all tests with verbose output
    cmds:
      - go test -v ./...

  test:run:
    desc: Run a specific test by name
    summary: |
      Run a specific test by name using the TEST parameter.

      Usage:
        task test:run TEST=TestModuleLoad
        task test:run TEST=TestParse
    vars:
      TEST: '{{.TEST | default ""}}'
    preconditions:
      - sh: '[ -n "{{.TEST}}" ]'
        msg: "TEST variable is required. Usage: task test:run TEST=TestName"
    cmds:
      - go test -v ./... -run "{{.TEST}}"

  test:coverage:
    desc: Run tests with coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
    generates:
      - coverage.out
      - coverage.html

  #########################
  ## Cluster management tasks
  #########################
  cluster:create:
    desc: Create a local kind cluster for development
    preconditions:
      - sh: command -v kind
        msg: "kind is not installed. Install it: https://kind.sigs.k8s.io/docs/user/quick-start/#installation"
    cmds:
      - kind create cluster --name {{.CLUSTER_NAME}} --config hack/kind-config.yaml --image {{.K8S_NODE_IMAGE}}

  cluster:delete:
    desc: Delete the local kind cluster
    preconditions:
      - sh: command -v kind
        msg: "kind is not installed. Install it: https://kind.sigs.k8s.io/docs/user/quick-start/#installation"
    cmds:
      - kind delete cluster --name {{.CLUSTER_NAME}}

  cluster:status:
    desc: Show the status of the local kind cluster
    preconditions:
      - sh: command -v kind
        msg: "kind is not installed. Install it: https://kind.sigs.k8s.io/docs/user/quick-start/#installation"
    cmds:
      - |
        if kind get clusters 2>/dev/null | grep -q "^{{.CLUSTER_NAME}}$"; then
          echo "Cluster '{{.CLUSTER_NAME}}' is running"
          kubectl cluster-info --context kind-{{.CLUSTER_NAME}}
        else
          echo "Cluster '{{.CLUSTER_NAME}}' is not running"
        fi

  cluster:recreate:
    desc: Delete and recreate the local kind cluster
    cmds:
      - task: cluster:delete
      - task: cluster:create

  cluster:operator:
    desc: Install a reconciling operator into the kind cluster
    summary: |
      Brings up an opm-operator that can actually reconcile ModuleInstances,
      which the operator-owned e2e tests require.

      By default this needs no local registry. Everything the kind flow
      resolves — core, the catalogs, and this repo's own
      testing.opmodel.dev/modules/cli/* fixtures — is published on GHCR, and the
      operator's built-in --registry default already routes both domains there.

      Two things still have to be true and neither is automatic:

        1. A cluster Platform singleton named "cluster" must exist, or every
           ModuleInstance parks at Ready=False/PlatformNotReady.
        2. The operator ships with no workload permissions — it expects to
           impersonate a per-instance ServiceAccount the CLI cannot write.

      To iterate against a module published to your LOCAL registry, set
      KIND_CUE_REGISTRY (see the var's comment for the in-cluster spelling).
      That path additionally requires the registry container from
      `task registry:start` at the workspace root, joins it to kind's docker
      network, and passes the mapping to `opm operator install` as the
      operator module's `registry` value in a values file, so it is recorded
      on the operator's instance and survives later installs. The module
      renders it as the operator's --registry flag. The operator's registry is
      a COMMAND-LINE FLAG, not an env var: --registry wins over OPM_REGISTRY
      (which is only read when the flag is empty), and the operator overwrites
      CUE_REGISTRY in its own process env. Setting either as a pod env var
      does nothing. Without KIND_CUE_REGISTRY no registry value is passed, so
      a mapping an earlier opt-in run recorded stays until
      `opm operator install --reset-values`.

      It finishes by waiting for Platform/cluster to be Ready for its current
      generation (cluster:operator:wait-ready), not merely stamped with
      status.operatorVersion, so an operator that cannot serve the pinned
      core or catalogs fails here, naming the Platform's stall reason.

      Idempotent: safe to re-run.
    preconditions:
      - sh: kubectl cluster-info --context kind-{{.CLUSTER_NAME}} &>/dev/null
        msg: "Cluster 'kind-{{.CLUSTER_NAME}}' is not running. Run: task cluster:create"
    # The binary below is this task's own tool, so the task builds it. `build`
    # is checksummed by its sources/generates, so this is a no-op when the
    # binary is current — and it is what lets an unattended caller (the e2e
    # suite's restore cleanup) work from a tree that was never built.
    deps: [build]
    cmds:
      # --config keeps this hermetic: the dev-cluster tooling must not depend on
      # a developer's personal ~/.opm being present or in the 0006:D39 format.
      # --skip-platform: hack/kind-platform.yaml below is the Platform. The
      # local-registry opt-in is an instance value, never a Deployment patch.
      - |
        registry='{{.KIND_CUE_REGISTRY}}'
        set --
        if [ -n "$registry" ]; then
          if ! docker ps -f name={{.REGISTRY_CONTAINER}} --format '{{`{{.Names}}`}}' | grep -qx {{.REGISTRY_CONTAINER}}; then
            echo "KIND_CUE_REGISTRY is set but registry container '{{.REGISTRY_CONTAINER}}' is not running." >&2
            echo "Run 'task registry:start' at the workspace root, or unset KIND_CUE_REGISTRY to use GHCR." >&2
            exit 1
          fi
          # The kind network only exists once a cluster has been created, so this
          # cannot move into cluster:create. Errors when already connected.
          docker network connect kind {{.REGISTRY_CONTAINER}} 2>/dev/null || true
          values=$(mktemp "${TMPDIR:-/tmp}/opm-operator-values.XXXXXX.cue")
          trap 'rm -f "$values"' EXIT
          printf 'values: registry: "%s"\n' "$registry" > "$values"
          echo "recording the operator registry value: $registry"
          set -- -f "$values"
        else
          echo "setting no operator registry value: the operator uses its built-in GHCR default unless an earlier run recorded a mapping (clear it with 'opm operator install --reset-values')"
        fi
        ./{{.BUILD_DIR}}/{{.BINARY_NAME}} operator install --config hack/opm-config.cue --context kind-{{.CLUSTER_NAME}} --timeout 180s --skip-platform "$@"
      - kubectl --context kind-{{.CLUSTER_NAME}} apply -f hack/kind-platform.yaml
      # The operator ships with no workload permissions — it expects to
      # impersonate a per-instance ServiceAccount the CLI cannot write. Dev-only
      # grant; see the file header.
      - kubectl --context kind-{{.CLUSTER_NAME}} apply -f hack/kind-operator-rbac.yaml
      # status.operatorVersion is stamped on every reconcile whatever its
      # outcome, so it proves only that the operator runs. The wait below asks
      # for Ready=True on the Platform's current generation instead.
      - task: cluster:operator:wait-ready
        vars:
          CLUSTER_NAME: "{{.CLUSTER_NAME}}"

  cluster:operator:wait-ready:
    desc: Wait until Platform/cluster is Ready for its current generation
    summary: |
      Passes only when Platform/cluster reports Ready=True AND
      status.observedGeneration equals metadata.generation.

      The generation check matters: `opm operator install` creates the
      Platform (generation 1) subscribed to the newest catalogs, and
      cluster:operator then applies hack/kind-platform.yaml, which changes the
      spec (generation 2). A Ready=True left over from generation 1 says
      nothing about the pinned catalogs, so it does not count.

      On timeout it prints both generations, the Ready and Stalled conditions
      and where to look next, and fails. A Stalled=True with a reason such as
      BuildFailed (MaterializeFailed on operator alpha.14) means the operator
      cannot serve the core or catalogs the Platform pins.

      PLATFORM_READY_TIMEOUT sets the wait in seconds (default 120).
    vars:
      PLATFORM_READY_TIMEOUT: '{{.PLATFORM_READY_TIMEOUT | default "120"}}'
    cmds:
      - |
        ctx=kind-{{.CLUSTER_NAME}}
        timeout={{.PLATFORM_READY_TIMEOUT}}
        echo "waiting up to ${timeout}s for Platform/cluster to be Ready for its current generation..."
        deadline=$(( $(date +%s) + timeout ))
        while :; do
          gen=$(kubectl --context "$ctx" get platform cluster -o jsonpath='{.metadata.generation}' 2>/dev/null || true)
          observed=$(kubectl --context "$ctx" get platform cluster -o jsonpath='{.status.observedGeneration}' 2>/dev/null || true)
          ready=$(kubectl --context "$ctx" get platform cluster -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
          if [ -n "$gen" ] && [ "$gen" = "$observed" ] && [ "$ready" = "True" ]; then
            version=$(kubectl --context "$ctx" get platform cluster -o jsonpath='{.status.operatorVersion}' 2>/dev/null || true)
            echo "operator ${version:-<unknown>} is reconciling; Platform/cluster is Ready for generation $gen"
            exit 0
          fi
          if [ "$(date +%s)" -ge "$deadline" ]; then break; fi
          sleep 2
        done
        echo "Platform/cluster is not Ready for its current generation after ${timeout}s." >&2
        echo "  generation: ${gen:-<none>}, observedGeneration: ${observed:-<none>}" >&2
        # field <condition type> <key>: one key of one condition, empty when absent.
        field() {
          kubectl --context "$ctx" get platform cluster \
            -o jsonpath="{.status.conditions[?(@.type==\"$1\")].$2}" 2>/dev/null || true
        }
        for type in Ready Stalled; do
          status=$(field "$type" status)
          if [ -z "$status" ]; then
            echo "  $type: <not set>" >&2
          else
            echo "  $type: $status $(field "$type" reason): $(field "$type" message)" >&2
          fi
        done
        echo "Check: kubectl --context $ctx -n opm-operator-system logs deploy/opm-operator-controller-manager" >&2
        echo "A 'Failed to resolve OPM core schema' line means the pod cannot reach the registry" >&2
        echo "its --registry flag (or built-in default) points at." >&2
        exit 1

  cluster:operator:status:
    desc: Report whether a reconciling operator is present in the kind cluster
    cmds:
      - |
        replicas=$(kubectl --context kind-{{.CLUSTER_NAME}} -n opm-operator-system get deployment opm-operator-controller-manager \
          -o jsonpath='{.status.availableReplicas}' 2>/dev/null || true)
        if [ -z "$replicas" ] || [ "$replicas" = "0" ]; then
          echo "No reconciling operator. Run: task cluster:operator"
          exit 1
        fi
        echo "operator available replicas: $replicas"
        kubectl --context kind-{{.CLUSTER_NAME}} -n opm-operator-system get deployment opm-operator-controller-manager \
          -o jsonpath='{.spec.template.spec.containers[0].args}'; echo
        echo "Platform/cluster operatorVersion: $(kubectl --context kind-{{.CLUSTER_NAME}} get platform cluster -o jsonpath='{.status.operatorVersion}' 2>/dev/null)"

  #########################
  ## Code quality tasks
  #########################
  lint:
    desc: Check the linter configuration (offline), then run linters
    cmds:
      - task: lint:config
      - golangci-lint run ./...

  lint:config:
    desc: Verify .golangci.yml against the committed schema, and that .golangci-lint-version, the schema and the workflows agree (offline)
    cmds:
      - bash .github/scripts/lint-config-check.sh

  lint:config:test:
    desc: Scenario test of the linter configuration check (offline)
    cmds:
      - bash .github/scripts/lint-config-check-test.sh

  lint:fix:
    desc: Run linters and fix issues
    cmds:
      - golangci-lint run --fix ./...

  #########################
  ## OpenSpec tasks
  #########################
  openspec:install:
    desc: Install the openspec CLI at the version CI pins
    cmds:
      - npm install -g @fission-ai/openspec@1.12.0

  openspec:check:
    desc: Validate every main spec and active change under openspec strict mode
    preconditions:
      - sh: command -v openspec >/dev/null
        msg: "openspec not found: run `task openspec:install` (needs npm)"
    cmds:
      - openspec validate --all --strict --no-interactive

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...
      - goimports -w .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - rm -f coverage.out coverage.html

  install:
    desc: Install the CLI to $GOPATH/bin
    cmds:
      - go install -ldflags "{{.LDFLAGS}}" ./cmd/opm

  check:
    desc: Run all checks (fmt, vet, lint, openspec, docs bundle, test, cascade wiring)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: openspec:check
      - task: docs:bundle:check
      - task: test
      - task: cascade:wiring:check

  generate:
    desc: Run go generate
    cmds:
      - go generate ./...

  #########################
  ## Docs tasks
  #########################
  # docs-kit.cue declares one docs bundle, cli: the command reference
  # opm-docs generates from hack/docskit-dump's dump of the cobra commands,
  # the authored pages under docs/site/, and the library, core and
  # opm-operator versions the cli pins. CI builds, signs and publishes it
  # through docs-kit's publish.yml (docs.yml, release.yml). These tasks run
  # the same opm-docs release locally. The release is pinned in
  # .opm-docs-version and in every publish.yml ref, and docs:bundle:check
  # refuses the two disagreeing.
  tools:opm-docs:
    desc: Install or reuse .bin/opm-docs, the checksum-verified docs-kit release named by .opm-docs-version
    cmds:
      - bash .tasks/opm-docs.sh install

  docs:bundle:
    desc: Build the cli docs bundle of the work tree into out/cli/ (a local preview of edge)
    deps: [tools:opm-docs]
    cmds:
      - .bin/opm-docs build --project cli --out out

  docs:pins:check:
    desc: Refuse a docs-kit publish.yml ref under .github/workflows/ that names another release than .opm-docs-version (offline)
    cmds:
      - bash .tasks/opm-docs.sh pin-check

  cascade:wiring:check:
    desc: Check the release-cascade caller workflows offline with the canonical .github wiring check and .tasks/cascade/wiring-check.yaml (CI adds --pin-on-main)
    cmds:
      - bash .tasks/cascade/wiring-check.sh

  docs:bundle:check:
    desc: Check the docs-kit pins agree, then build and lint the cli docs bundle into a temporary directory
    deps: [tools:opm-docs]
    cmds:
      - task: docs:pins:check
      - .bin/opm-docs check --project cli

  #########################
  ## Operator lifecycle tasks
  #########################
  operator:pin:
    desc: Pin the default operator module version and the operator it deploys
    summary: |
      Resolves the operator module version through the registry
      (OPM_REGISTRY, else CUE_REGISTRY, else the cli default), reads the
      operator release it deploys from the module's operator package (no
      render), and rewrites internal/operator/pin.go. The only writer of
      that file.

      Usage:
        task operator:pin VERSION=0.1.0
    vars:
      VERSION: '{{.VERSION | default ""}}'
    preconditions:
      - sh: '[ -n "{{.VERSION}}" ]'
        msg: "VERSION variable is required. Usage: task operator:pin VERSION=<module version>"
    cmds:
      - go run ./hack/operator-pin "{{.VERSION}}"

  #########################
  ## Release tasks
  #########################
  deps:release-check:
    desc: "Check release pins (G1): no replace, published OPM pins (nested modules by their subdir tag), no dev template pins, the operator module pin is served and records the operator it deploys, a docs bundle for every docs pin (G2-pins)"
    cmds:
      - .github/scripts/release-pin-check.sh

  # Release cascade (workspace RELEASING.md, "The cascade"; Phase 2 cascade
  # contract §3 and §5). Run every cascade task with `task -x`, or go-task turns
  # exit 3 into 201. The resolver lives in open-platform-model/.github; each
  # task finds it itself (never a global var, which would run for every task).
  deps:cascade:
    desc: "Release cascade: move the cli's upstream pins to the newest published versions in the working tree; exit 0 changed, 3 nothing to do, other on error, so run it as task -x; see workspace RELEASING.md \"The cascade\""
    vars: &cascade_vars
      CASCADE_RESOLVER_PATH:
        sh: |
          if [ -n "${CASCADE_RESOLVER:-}" ]; then
            case "$CASCADE_RESOLVER" in /*) ;; *) echo "CASCADE_RESOLVER must be absolute" >&2; exit 1 ;; esac
            printf '%s\n' "$CASCADE_RESOLVER"; exit 0
          fi
          common=$(git rev-parse --path-format=absolute --git-common-dir) || exit 1
          printf '%s\n' "$(dirname "$common")/../.github/.github/scripts/cascade/cascade-resolve.sh"
    env: &cascade_env
      CASCADE_RESOLVER: '{{.CASCADE_RESOLVER_PATH}}'
    preconditions: &cascade_pre
      - sh: test -x '{{.CASCADE_RESOLVER_PATH}}'
        msg: "cascade resolver not found: check out open-platform-model/.github beside this repo, or set CASCADE_RESOLVER"
    cmds:
      - .tasks/cascade/cascade.sh

  deps:cascade:title:
    desc: "Release cascade: print the cascade PR title for the diff against CASCADE_BASE (default origin/main); see workspace RELEASING.md \"The cascade\""
    vars: *cascade_vars
    env: *cascade_env
    preconditions: *cascade_pre
    cmds:
      - '"$CASCADE_RESOLVER" title --classes .tasks/cascade/classes --pins .tasks/cascade/pins.sh'

  deps:cascade:body:
    desc: "Release cascade: print the cascade PR body for the diff against CASCADE_BASE (default origin/main); see workspace RELEASING.md \"The cascade\""
    vars: *cascade_vars
    env: *cascade_env
    preconditions: *cascade_pre
    cmds:
      - '"$CASCADE_RESOLVER" body --classes .tasks/cascade/classes --pins .tasks/cascade/pins.sh'

  # The test needs no resolver checkout: every scenario runs against the stub in
  # testdata/, and only S5 also uses CASCADE_RESOLVER_REAL when it is set.
  deps:cascade:test:
    desc: "Release cascade: test deps:cascade in sandbox copies against the stub resolver (CASCADE_TEST_SET=offline|all; S5 needs CASCADE_RESOLVER_REAL); see workspace RELEASING.md \"The cascade\""
    cmds:
      - .tasks/cascade/test.sh
